<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nimah Liquor Store</title>
<link rel="icon" href="data:," />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.0/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #141F18; }
  * { box-sizing: border-box; }
  input:focus, select:focus, button:focus { outline: 2px solid #C9A227; outline-offset: 1px; }
  ::placeholder { color: #6C7A70; }
  @media (max-width: 720px) {
    .grid4 { grid-template-columns: 1fr !important; }
    .grid3 { grid-template-columns: 1fr !important; }
    .grid2 { grid-template-columns: 1fr !important; }
    .shopgrid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;

/* ---------------------------------------------------------------------- */
/*  Tokens — "cellar ledger": bottle-glass green, foil gold, paper cream  */
/* ---------------------------------------------------------------------- */
const T = {
  bg: "#141F18", panel: "#1B2A20", panel2: "#22342A", line: "#33473B",
  gold: "#C9A227", goldLight: "#E4C766", paper: "#F3EFE2", paperDim: "#9FB0A3",
  green: "#4C7A5B", red: "#C0564C", redBg: "#3A2420", okBg: "#20362A",
};
const DISPLAY = '"Iowan Old Style", Georgia, "Times New Roman", serif';
const MONO = 'ui-monospace, SFMono-Regular, "Roboto Mono", monospace';

const fmt = (n) =>
  new Intl.NumberFormat("en-TZ", { maximumFractionDigits: 0 }).format(Math.round(n || 0)) + " TZS";
const uid = (p = "") => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0, 10);

/* ---------------------------------------------------------------------- */
/*  Storage — localStorage-backed (this file runs standalone, no server) */
/* ---------------------------------------------------------------------- */
const LS_PREFIX = "nimah_";
async function loadKey(key, fallback) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
async function saveKey(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); }
  catch (e) { console.error("storage save failed", key, e); }
}

const SEED_USERS = [
  { id: uid("u"), username: "admin", password: "admin123", role: "admin", name: "Neema Hamisi" },
  { id: uid("u"), username: "worker", password: "worker123", role: "worker", name: "Store Attendant" },
];
const SEED_PRODUCTS = [
  { id: uid("p"), name: "Konyagi 750ml", category: "Spirits", unit: "Bottle", openingStock: 50, cost: 8000, price: 12000, reorder: 10 },
  { id: uid("p"), name: "Serengeti Lager 500ml", category: "Beer", unit: "Bottle", openingStock: 200, cost: 1500, price: 2500, reorder: 30 },
  { id: uid("p"), name: "Kilimanjaro Lager 500ml", category: "Beer", unit: "Bottle", openingStock: 150, cost: 1500, price: 2500, reorder: 30 },
  { id: uid("p"), name: "Amarula 750ml", category: "Liqueur", unit: "Bottle", openingStock: 20, cost: 25000, price: 35000, reorder: 5 },
];

/* ---------------------------------------------------------------------- */
/*  Inline icon set (no external icon library)                            */
/* ---------------------------------------------------------------------- */
function Icon({ name, size = 16, color = "currentColor", style }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style };
  const paths = {
    wine: <><path d="M8 2h8l-1 8a3 3 0 0 1-6 0L8 2Z"/><path d="M12 13v6"/><path d="M9 21h6"/></>,
    logout: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></>,
    package: <><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></>,
    cart: <><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2l2.6 12.4A2 2 0 0 0 8.6 17H18a2 2 0 0 0 2-1.6L21.6 7H6"/></>,
    clipboard: <><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 11h6M9 15h6"/></>,
    dashboard: <><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="10" width="7.5" height="11" rx="1.5"/><rect x="3" y="14.5" width="7.5" height="6.5" rx="1.5"/></>,
    plus: <><path d="M12 5v14M5 12h14"/></>,
    alert: <><path d="M10.3 3.6 2.5 18a1 1 0 0 0 .9 1.5h17.2a1 1 0 0 0 .9-1.5L13.7 3.6a1 1 0 0 0-1.4 0Z"/><path d="M12 9v4M12 17h.01"/></>,
    trending: <><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></>,
    boxes: <><path d="M3 8.5 8 6l5 2.5-5 2.5-5-2.5Z"/><path d="M3 8.5v6L8 17l5-2.5v-6"/><path d="M13 8.5 16 7l5 2.5-5 2.5-3-1.5"/><path d="M21 9.5v5L16 17v-4.5"/></>,
    receipt: <><path d="M6 2h12v19l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5Z"/><path d="M9 7h6M9 11h6M9 15h4"/></>,
    check: <><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.3 2.3L16 10"/></>,
    clock: <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></>,
    trash: <><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M10 11v6M14 11v6"/></>,
    search: <><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></>,
    shield: <><path d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></>,
    hardhat: <><path d="M4 16a8 8 0 0 1 16 0Z"/><path d="M2 16h20"/><path d="M12 8V5"/><path d="M9 16v-4M15 16v-4"/></>,
    user: <><circle cx="12" cy="8" r="4"/><path d="M4 20c1.8-4 5-6 8-6s6.2 2 8 6"/></>,
    x: <><path d="M18 6 6 18M6 6l12 12"/></>,
  };
  return <svg {...common}>{paths[name] || null}</svg>;
}

/* ---------------------------------------------------------------------- */
/*  Small UI atoms                                                        */
/* ---------------------------------------------------------------------- */
function Card({ children, style, className = "" }) {
  return <div className={className} style={{ background: T.panel, border: `1px solid ${T.line}`, borderRadius: 10, ...style }}>{children}</div>;
}
function Field({ label, children }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12, color: T.paperDim }}>
      <span style={{ letterSpacing: 0.4, textTransform: "uppercase", fontSize: 10 }}>{label}</span>
      {children}
    </label>
  );
}
const inputStyle = { background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, padding: "9px 10px", color: T.paper, fontSize: 14, outline: "none", fontFamily: "inherit", width: "100%" };
function Input(props) { return <input {...props} style={{ ...inputStyle, ...(props.style || {}) }} />; }
function Select(props) { return <select {...props} style={{ ...inputStyle, ...(props.style || {}) }} />; }

function Button({ children, onClick, variant = "solid", style, type = "button", disabled }) {
  const base = { fontFamily: "inherit", fontSize: 13, fontWeight: 600, padding: "10px 16px", borderRadius: 7, cursor: disabled ? "not-allowed" : "pointer", border: "1px solid transparent", display: "inline-flex", alignItems: "center", gap: 8, opacity: disabled ? 0.5 : 1, transition: "filter 120ms ease" };
  const variants = {
    solid: { background: T.gold, color: "#20200F" },
    ghost: { background: "transparent", color: T.paper, border: `1px solid ${T.line}` },
    danger: { background: T.red, color: "#241412" },
  };
  return (
    <button type={type} disabled={disabled} onClick={onClick}
      onMouseEnter={(e) => (e.currentTarget.style.filter = "brightness(1.08)")}
      onMouseLeave={(e) => (e.currentTarget.style.filter = "none")}
      style={{ ...base, ...variants[variant], ...style }}>
      {children}
    </button>
  );
}
function Stat({ label, value, accent, icon }) {
  return (
    <Card style={{ padding: 16, flex: 1, minWidth: 150 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontSize: 10, letterSpacing: 0.6, textTransform: "uppercase", color: T.paperDim }}>{label}</span>
        {icon && <Icon name={icon} size={15} color={accent || T.gold} />}
      </div>
      <div style={{ fontFamily: DISPLAY, fontSize: 24, marginTop: 8, color: accent || T.paper }}>{value}</div>
    </Card>
  );
}
function Pill({ children, tone = "ok" }) {
  const tones = { ok: { bg: T.okBg, fg: "#8FD6A8" }, warn: { bg: T.redBg, fg: "#E79C93" }, idle: { bg: T.panel2, fg: T.paperDim } };
  const c = tones[tone];
  return <span style={{ background: c.bg, color: c.fg, fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 999, letterSpacing: 0.3 }}>{children}</span>;
}
function SectionTitle({ icon, title, sub }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Icon name={icon} size={16} color={T.gold} />
        <span style={{ fontFamily: DISPLAY, fontSize: 17 }}>{title}</span>
      </div>
      {sub && <div style={{ fontSize: 12, color: T.paperDim, marginTop: 3 }}>{sub}</div>}
    </div>
  );
}
function Table({ cols, children }) {
  return (
    <div style={{ overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
        <thead><tr>{cols.map((c) => (
          <th key={c} style={{ textAlign: "left", padding: "9px 10px", borderBottom: `1px solid ${T.line}`, color: T.paperDim, fontSize: 10, textTransform: "uppercase", letterSpacing: 0.4, whiteSpace: "nowrap" }}>{c}</th>
        ))}</tr></thead>
        <tbody>{children}</tbody>
      </table>
    </div>
  );
}
const td = { padding: "9px 10px", borderBottom: `1px solid ${T.line}`, fontFamily: MONO, fontSize: 12.5 };

/* ---------------------------------------------------------------------- */
/*  Tiny dependency-free charts                                           */
/* ---------------------------------------------------------------------- */
function MiniLine({ data, valueKey, labelKey, height = 200 }) {
  const w = 560, h = height, pad = 28;
  if (!data.length) return <Empty text="No sales recorded yet." />;
  const values = data.map((d) => d[valueKey]);
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const x = (i) => pad + (i * (w - pad * 2)) / Math.max(data.length - 1, 1);
  const y = (v) => h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
  const points = data.map((d, i) => `${x(i)},${y(d[valueKey])}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height }} preserveAspectRatio="none">
      {[0, 0.5, 1].map((f) => (
        <line key={f} x1={pad} x2={w - pad} y1={pad + f * (h - pad * 2)} y2={pad + f * (h - pad * 2)} stroke={T.line} strokeDasharray="3 3" />
      ))}
      <polyline points={points} fill="none" stroke={T.gold} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {data.map((d, i) => <circle key={i} cx={x(i)} cy={y(d[valueKey])} r="3.2" fill={T.goldLight}><title>{`${d[labelKey]}: ${fmt(d[valueKey])}`}</title></circle>)}
      <text x={pad} y={h - 6} fill={T.paperDim} fontSize="9">{data[0][labelKey]}</text>
      <text x={w - pad} y={h - 6} fill={T.paperDim} fontSize="9" textAnchor="end">{data[data.length - 1][labelKey]}</text>
    </svg>
  );
}
function MiniBarList({ data, labelKey, valueKey }) {
  if (!data.length) return <Empty text="No sales recorded yet." />;
  const max = Math.max(...data.map((d) => d[valueKey]), 1);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {data.map((d, i) => (
        <div key={i}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
            <span>{d[labelKey]}</span><span style={{ fontFamily: MONO, color: T.paperDim }}>{d[valueKey]}</span>
          </div>
          <div style={{ background: T.bg, borderRadius: 4, height: 8 }}>
            <div style={{ width: `${(d[valueKey] / max) * 100}%`, background: T.gold, height: 8, borderRadius: 4 }} />
          </div>
        </div>
      ))}
    </div>
  );
}
const DONUT_COLORS = [T.gold, T.green, "#7C9C86", "#A9821E", "#5C7F6A", "#8E6E1E"];
function MiniDonut({ data, labelKey, valueKey }) {
  if (!data.length) return <Empty text="No stock recorded yet." />;
  const total = data.reduce((s, d) => s + d[valueKey], 0) || 1;
  let acc = 0;
  const stops = data.map((d, i) => {
    const start = (acc / total) * 360; acc += d[valueKey];
    const end = (acc / total) * 360;
    return `${DONUT_COLORS[i % DONUT_COLORS.length]} ${start}deg ${end}deg`;
  });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
      <div style={{ width: 130, height: 130, borderRadius: "50%", background: `conic-gradient(${stops.join(",")})`, flexShrink: 0, boxShadow: `inset 0 0 0 22px ${T.panel}` }} />
      <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
        {data.map((d, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12 }}>
            <span style={{ width: 9, height: 9, borderRadius: 2, background: DONUT_COLORS[i % DONUT_COLORS.length] }} />
            <span>{d[labelKey]}</span>
            <span style={{ color: T.paperDim, fontFamily: MONO, fontSize: 11 }}>{Math.round((d[valueKey] / total) * 100)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}
function Empty({ text }) { return <div style={{ color: T.paperDim, fontSize: 13, padding: "20px 0" }}>{text}</div>; }

/* ---------------------------------------------------------------------- */
/*  Root App                                                              */
/* ---------------------------------------------------------------------- */
function App() {
  const [ready, setReady] = useState(false);
  const [users, setUsers] = useState([]);
  const [products, setProducts] = useState([]);
  const [purchases, setPurchases] = useState([]);
  const [sales, setSales] = useState([]);
  const [orders, setOrders] = useState([]);
  const [currentUser, setCurrentUser] = useState(null);
  const [toast, setToast] = useState(null);

  const notify = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); }, []);

  const refreshAll = useCallback(async () => {
    const [u, p, pu, sa, or] = await Promise.all([
      loadKey("users", null), loadKey("products", null),
      loadKey("purchases", []), loadKey("sales", []), loadKey("orders", []),
    ]);
    let finalUsers = u, finalProducts = p;
    if (!u) { finalUsers = SEED_USERS; await saveKey("users", finalUsers); }
    if (!p) { finalProducts = SEED_PRODUCTS; await saveKey("products", finalProducts); }
    setUsers(finalUsers); setProducts(finalProducts);
    setPurchases(pu); setSales(sa); setOrders(or);
  }, []);

  useEffect(() => { (async () => { await refreshAll(); setReady(true); })(); }, [refreshAll]);

  const stockFor = useCallback((productId) => {
    const opening = products.find((p) => p.id === productId)?.openingStock || 0;
    const bought = purchases.filter((x) => x.productId === productId).reduce((s, x) => s + Number(x.qty), 0);
    const sold = sales.filter((x) => x.productId === productId).reduce((s, x) => s + Number(x.qty), 0);
    return opening + bought - sold;
  }, [products, purchases, sales]);

  const persist = {
    users: async (next) => { setUsers(next); await saveKey("users", next); },
    products: async (next) => { setProducts(next); await saveKey("products", next); },
    purchases: async (next) => { setPurchases(next); await saveKey("purchases", next); },
    sales: async (next) => { setSales(next); await saveKey("sales", next); },
    orders: async (next) => { setOrders(next); await saveKey("orders", next); },
  };

  const addProduct = async (prod) => persist.products([...products, { id: uid("p"), ...prod }]);
  const addPurchase = async (row) => persist.purchases([{ id: uid("pu"), ...row }, ...purchases]);
  const addSale = async (row) => persist.sales([{ id: uid("s"), ...row }, ...sales]);
  const placeOrder = async (order) => persist.orders([{ id: uid("o"), status: "pending", createdAt: todayISO(), ...order }, ...orders]);

  const fulfillOrder = async (orderId, invoiceNo) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const newSales = order.items.map((it) => ({ id: uid("s"), date: todayISO(), invoiceNo, productId: it.productId, qty: it.qty, price: it.price, customer: order.customerName, payment: "Order" }));
    await persist.sales([...newSales, ...sales]);
    await persist.orders(orders.map((o) => (o.id === orderId ? { ...o, status: "fulfilled", invoiceNo } : o)));
    notify(`Order fulfilled — invoice ${invoiceNo} created`);
  };
  const cancelOrder = async (orderId) => persist.orders(orders.map((o) => (o.id === orderId ? { ...o, status: "cancelled" } : o)));

  const login = (username, password, role) => {
    const u = users.find((x) => x.username === username && x.password === password && x.role === role);
    if (!u) return notify("Invalid username or password");
    setCurrentUser(u);
  };
  const signupCustomer = async (data) => {
    if (users.some((u) => u.username === data.username)) return notify("That username is taken");
    const u = { id: uid("u"), role: "customer", ...data };
    await persist.users([...users, u]);
    setCurrentUser(u);
  };
  const logout = () => setCurrentUser(null);

  if (!ready) {
    return <div style={{ ...shellStyle, alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: T.paperDim, fontFamily: DISPLAY, fontSize: 18 }}>Opening the cellar…</div>
    </div>;
  }

  return (
    <div style={shellStyle}>
      {toast && (
        <div style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)", background: T.goldLight, color: "#20200F", padding: "9px 18px", borderRadius: 8, fontSize: 13, fontWeight: 700, zIndex: 999, boxShadow: "0 8px 24px rgba(0,0,0,.4)" }}>
          {toast}
        </div>
      )}
      {!currentUser ? (
        <LoginScreen onLogin={login} onSignup={signupCustomer} notify={notify} />
      ) : (
        <Shell user={currentUser} onLogout={logout}
          products={products} purchases={purchases} sales={sales} orders={orders} stockFor={stockFor}
          addProduct={addProduct} addPurchase={addPurchase} addSale={addSale}
          placeOrder={placeOrder} fulfillOrder={fulfillOrder} cancelOrder={cancelOrder} notify={notify} />
      )}
    </div>
  );
}
const shellStyle = { minHeight: "100vh", background: T.bg, color: T.paper, fontFamily: 'system-ui, -apple-system, "Segoe UI", sans-serif', display: "flex", flexDirection: "column" };

/* ---------------------------------------------------------------------- */
/*  Login / Signup                                                        */
/* ---------------------------------------------------------------------- */
function LoginScreen({ onLogin, onSignup, notify }) {
  const [role, setRole] = useState("customer");
  const [mode, setMode] = useState("login");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const roles = [{ id: "customer", label: "Customer", icon: "user" }, { id: "worker", label: "Worker", icon: "hardhat" }, { id: "admin", label: "Admin", icon: "shield" }];

  const submit = (e) => {
    e.preventDefault();
    if (mode === "signup") {
      if (!username || !password || !name) return notify("Fill in all fields");
      onSignup({ username, password, name, phone });
    } else {
      if (!username || !password) return notify("Enter username and password");
      onLogin(username, password, role);
    }
  };

  return (
    <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ width: "100%", maxWidth: 420 }}>
        <div style={{ textAlign: "center", marginBottom: 26 }}>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 10, color: T.gold }}>
            <Icon name="wine" size={26} />
            <span style={{ fontFamily: DISPLAY, fontSize: 26, letterSpacing: 0.5 }}>Nimah Liquor Store</span>
          </div>
          <div style={{ color: T.paperDim, fontSize: 12, marginTop: 6, letterSpacing: 1.5, textTransform: "uppercase" }}>Arusha · Cellar &amp; Ledger Portal</div>
        </div>
        <Card style={{ padding: 22 }}>
          <div style={{ display: "flex", gap: 6, marginBottom: 18, background: T.bg, padding: 4, borderRadius: 8 }}>
            {roles.map((r) => (
              <button key={r.id} onClick={() => { setRole(r.id); setMode("login"); }}
                style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: "8px 6px", borderRadius: 6, border: "none", cursor: "pointer", background: role === r.id ? T.gold : "transparent", color: role === r.id ? "#20200F" : T.paperDim, fontSize: 12, fontWeight: 700 }}>
                <Icon name={r.icon} size={14} /> {r.label}
              </button>
            ))}
          </div>
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {mode === "signup" && (<>
              <Field label="Full name"><Input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Grace Mushi" /></Field>
              <Field label="Phone (optional)"><Input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="07xx xxx xxx" /></Field>
            </>)}
            <Field label="Username"><Input value={username} onChange={(e) => setUsername(e.target.value)} placeholder="username" autoComplete="username" /></Field>
            <Field label="Password"><Input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password" /></Field>
            <Button type="submit" style={{ justifyContent: "center", marginTop: 4 }}>
              {mode === "signup" ? "Create account & continue" : `Log in as ${roles.find((r) => r.id === role).label}`}
            </Button>
          </form>
          {role === "customer" && (
            <div style={{ textAlign: "center", marginTop: 14, fontSize: 12, color: T.paperDim }}>
              {mode === "login" ? (<>New here? <a onClick={() => setMode("signup")} style={linkStyle}>Create a customer account</a></>)

/* ---------------------------------------------------------------------- */
/*  WORKER — Products & Stock                                             */
/* ---------------------------------------------------------------------- */
function WorkerProducts({ products, purchases, sales, stockFor, addProduct, notify }) {
  const [form, setForm] = useState({ name: "", category: "", unit: "Bottle", openingStock: "", cost: "", price: "", reorder: "" });
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    if (!form.name || !form.cost || !form.price) return notify("Name, cost and price are required");
    addProduct({ name: form.name, category: form.category || "General", unit: form.unit, openingStock: Number(form.openingStock) || 0, cost: Number(form.cost), price: Number(form.price), reorder: Number(form.reorder) || 0 });
    setForm({ name: "", category: "", unit: "Bottle", openingStock: "", cost: "", price: "", reorder: "" });
    notify("Product added");
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <Card style={{ padding: 18 }}>
        <SectionTitle icon="plus" title="Add a product" />
        <form onSubmit={submit} className="grid4" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginTop: 12 }}>
          <Field label="Product name"><Input value={form.name} onChange={set("name")} placeholder="e.g. Konyagi 750ml" /></Field>
          <Field label="Category"><Input value={form.category} onChange={set("category")} placeholder="Spirits / Beer / Wine" /></Field>
          <Field label="Unit"><Input value={form.unit} onChange={set("unit")} placeholder="Bottle / Crate" /></Field>
          <Field label="Opening stock"><Input type="number" value={form.openingStock} onChange={set("openingStock")} /></Field>
          <Field label="Purchase cost (TZS)"><Input type="number" value={form.cost} onChange={set("cost")} /></Field>
          <Field label="Selling price (TZS)"><Input type="number" value={form.price} onChange={set("price")} /></Field>
          <Field label="Reorder level"><Input type="number" value={form.reorder} onChange={set("reorder")} /></Field>
          <div style={{ display: "flex", alignItems: "flex-end" }}>
            <Button type="submit" style={{ width: "100%", justifyContent: "center" }}><Icon name="plus" size={14} /> Add product</Button>
          </div>
        </form>
      </Card>
      <Card style={{ padding: 18 }}>
        <SectionTitle icon="boxes" title={`Stock list (${products.length})`} sub="Current stock recalculates automatically from purchases and sales." />
        <div style={{ marginTop: 10 }}>
          <Table cols={["Product", "Category", "Opening", "Purchased", "Sold", "Current Stock", "Value", "Status"]}>
            {products.map((p) => {
              const bought = purchases.filter((x) => x.productId === p.id).reduce((s, x) => s + Number(x.qty), 0);
              const sold = sales.filter((x) => x.productId === p.id).reduce((s, x) => s + Number(x.qty), 0);
              const stock = stockFor(p.id); const low = stock <= p.reorder;
              return (
                <tr key={p.id}>
                  <td style={{ ...td, fontFamily: "inherit", fontWeight: 600 }}>{p.name}</td>
                  <td style={td}>{p.category}</td><td style={td}>{p.openingStock}</td>
                  <td style={td}>{bought}</td><td style={td}>{sold}</td>
                  <td style={{ ...td, color: low ? "#E79C93" : T.paper, fontWeight: 700 }}>{stock}</td>
                  <td style={td}>{fmt(stock * p.cost)}</td>
                  <td style={td}><Pill tone={low ? "warn" : "ok"}>{low ? "Reorder" : "OK"}</Pill></td>
                </tr>
              );
            })}
          </Table>
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */
/*  WORKER — Sales (stock OUT)                                            */
/* ---------------------------------------------------------------------- */
function WorkerSales({ products, sales, stockFor, addSale, notify }) {
  const [form, setForm] = useState({ date: todayISO(), invoiceNo: "", productId: products[0]?.id || "", qty: "", customer: "", payment: "Cash" });
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const prod = products.find((p) => p.id === form.productId);
  const available = prod ? stockFor(prod.id) : 0;
  const submit = (e) => {
    e.preventDefault();
    if (!form.productId || !form.qty || !form.invoiceNo) return notify("Invoice No, product and quantity are required");
    if (Number(form.qty) > available) return notify(`Only ${available} in stock`);
    addSale({ date: form.date, invoiceNo: form.invoiceNo, productId: form.productId, qty: Number(form.qty), price: prod?.price || 0, customer: form.customer || "Walk-in", payment: form.payment });
    setForm({ ...form, qty: "", customer: "" });
    notify("Sale recorded — stock updated");
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <Card style={{ padding: 18 }}>
        <SectionTitle icon="receipt" title="Record a sale" sub="Unit price fills in automatically. Use the same Invoice No for every item on one receipt." />
        <form onSubmit={submit} className="grid3" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginTop: 12 }}>
          <Field label="Date"><Input type="date" value={form.date} onChange={set("date")} /></Field>
          <Field label="Invoice No"><Input value={form.invoiceNo} onChange={set("invoiceNo")} placeholder="INV1001" /></Field>
          <Field label="Payment method"><Select value={form.payment} onChange={set("payment")}>{["Cash", "Mobile Money", "Bank", "Credit"].map((m) => <option key={m}>{m}</option>)}</Select></Field>
          <Field label="Product"><Select value={form.productId} onChange={set("productId")}>{products.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</Select></Field>
          <Field label={`Quantity (in stock: ${available})`}><Input type="number" value={form.qty} onChange={set("qty")} /></Field>
          <Field label="Customer"><Input value={form.customer} onChange={set("customer")} placeholder="Walk-in Customer" /></Field>
          <div style={{ fontSize: 12, color: T.paperDim, alignSelf: "center" }}>Unit price <b style={{ color: T.paper, fontFamily: MONO }}>{fmt(prod?.price || 0)}</b></div>
          <div style={{ gridColumn: "1 / -1" }}><Button type="submit"><Icon name="plus" size={14} /> Add sale</Button></div>
        </form>
      </Card>
      <Card style={{ padding: 18 }}>
        <SectionTitle icon="clipboard" title={`Sales history (${sales.length})`} />
        <div style={{ marginTop: 10 }}>
          <Table cols={["Date", "Invoice", "Product", "Qty", "Price", "Total", "Customer", "Payment"]}>
            {sales.map((row) => {
              const p = products.find((x) => x.id === row.productId);
              return (
                <tr key={row.id}>
                  <td style={td}>{row.date}</td><td style={td}>{row.invoiceNo}</td>
                  <td style={{ ...td, fontFamily: "inherit" }}>{p?.name || "—"}</td>
                  <td style={td}>{row.qty}</td><td style={td}>{fmt(row.price)}</td>
                  <td style={td}>{fmt(row.price * row.qty)}</td>
                  <td style={{ ...td, fontFamily: "inherit" }}>{row.customer}</td><td style={td}>{row.payment}</td>
                </tr>
              );
            })}
          </Table>
        </div>
      </Card>
    </div>
  );
}

          {pending.length === 0 && <div style={{ color: T.paperDim, fontSize: 13 }}>No pending orders right now.</div>}

            <div key={o.id} style={{ border: `1px solid ${T.line}`, borderRadius: 8, padding: 14, background: T.bg }}>

                <div style={{ display: "flex", gap: 8 }}>
                  <Button variant="ghost" onClick={() => cancelOrder(o.id)}><Icon name="x" size={14} /> Cancel</Button>
                  <Button onClick={() => fulfill(o)}><Icon name="check" size={14} /> Fulfill order</Button>

                <td style={td}><Pill tone={o.status === "fulfilled" ? "ok" : "warn"}>{o.status}</Pill></td>

            ))}
          </Table>
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  ADMIN — Dashboard                                                     */
/* ---------------------------------------------------------------------- */
function AdminDashboard({ products, purchases, sales, orders, stockFor }) {
  const totalStockValue = useMemo(() => products.reduce((s, p) => s + stockFor(p.id) * p.cost, 0), [products, stockFor]);
  const lowStock = useMemo(() => products.filter((p) => stockFor(p.id) <= p.reorder), [products, stockFor]);
  const totalSales = useMemo(() => sales.reduce((s, r) => s + r.qty * r.price, 0), [sales]);
  const totalPurchases = useMemo(() => purchases.reduce((s, r) => s + r.qty * r.cost, 0), [purchases]);
  const totalProfit = useMemo(() => sales.reduce((s, r) => { const p = products.find((x) => x.id === r.productId); return s + r.qty * (r.price - (p?.cost || 0)); }, 0), [sales, products]);
  const pendingOrders = orders.filter((o) => o.status === "pending").length;

  const topProducts = useMemo(() => {
    const map = {};
    sales.forEach((r) => { map[r.productId] = (map[r.productId] || 0) + r.qty; });
    return Object.entries(map).map(([id, qty]) => ({ name: products.find((p) => p.id === id)?.name || "—", qty })).sort((a, b) => b.qty - a.qty).slice(0, 5);
  }, [sales, products]);

  const byDay = useMemo(() => {
    const map = {};
    sales.forEach((r) => { map[r.date] = (map[r.date] || 0) + r.qty * r.price; });
    return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0])).map(([date, total]) => ({ date, total }));
  }, [sales]);

  const catBreakdown = useMemo(() => {
    const map = {};
    products.forEach((p) => { map[p.category] = (map[p.category] || 0) + stockFor(p.id) * p.cost; });
    return Object.entries(map).map(([name, value]) => ({ name, value })).filter((d) => d.value > 0);
  }, [products, stockFor]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
        <Stat label="Stock Value" value={fmt(totalStockValue)} icon="boxes" />
        <Stat label="Total Sales" value={fmt(totalSales)} icon="trending" />
        <Stat label="Total Purchases" value={fmt(totalPurchases)} icon="package" />
        <Stat label="Gross Profit" value={fmt(totalProfit)} accent={T.goldLight} icon="receipt" />
        <Stat label="Low Stock Items" value={lowStock.length} accent={lowStock.length ? "#E79C93" : T.paper} icon="alert" />
        <Stat label="Pending Orders" value={pendingOrders} icon="clock" />
      </div>
      <div className="grid2" style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 18 }}>
        <Card style={{ padding: 18 }}>
          <SectionTitle icon="trending" title="Sales over time" sub="Pulled directly from every sale entered on the Worker page." />
          <div style={{ marginTop: 10 }}><MiniLine data={byDay} valueKey="total" labelKey="date" /></div>
        </Card>
        <Card style={{ padding: 18 }}>
          <SectionTitle icon="boxes" title="Stock value by category" />
          <div style={{ marginTop: 14 }}><MiniDonut data={catBreakdown} labelKey="name" valueKey="value" /></div>
        </Card>
      </div>
      <div className="grid2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        <Card style={{ padding: 18 }}>
          <SectionTitle icon="trending" title="Top 5 selling products" />
          <div style={{ marginTop: 14 }}><MiniBarList data={topProducts} labelKey="name" valueKey="qty" /></div>
        </Card>
        <Card style={{ padding: 18 }}>
          <SectionTitle icon="alert" title={`Reorder now (${lowStock.length})`} sub="Live from the Products page workers maintain." />
          <div style={{ marginTop: 10 }}>
            <Table cols={["Product", "Stock", "Reorder Level"]}>
              {lowStock.length === 0 && <tr><td style={td} colSpan={3}>Everything is above its reorder level.</td></tr>}
              {lowStock.map((p) => (
                <tr key={p.id}>
                  <td style={{ ...td, fontFamily: "inherit" }}>{p.name}</td>
                  <td style={{ ...td, color: "#E79C93", fontWeight: 700 }}>{stockFor(p.id)}</td>
                  <td style={td}>{p.reorder}</td>
                </tr>
              ))}
            </Table>
          </div>
        </Card>
      </div>
      <Card style={{ padding: 18 }}>
        <SectionTitle icon="receipt" title="Most recent sales" />
        <div style={{ marginTop: 10 }}>
          <Table cols={["Date", "Invoice", "Product", "Qty", "Total", "Customer"]}>
            {sales.slice(0, 8).map((row) => {
              const p = products.find((x) => x.id === row.productId);
              return (
                <tr key={row.id}>
                  <td style={td}>{row.date}</td><td style={td}>{row.invoiceNo}</td>
                  <td style={{ ...td, fontFamily: "inherit" }}>{p?.name || "—"}</td>
                  <td style={td}>{row.qty}</td><td style={td}>{fmt(row.qty * row.price)}</td>
                  <td style={{ ...td, fontFamily: "inherit" }}>{row.customer}</td>
                </tr>
              );
            })}
          </Table>
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  CUSTOMER — Shop & cart                                                */
/* ---------------------------------------------------------------------- */
function CustomerShop({ products, stockFor, placeOrder, user, notify }) {
  const [query, setQuery] = useState("");
  const [cart, setCart] = useState({});
  const [phone, setPhone] = useState(user.phone || "");
  const visible = products.filter((p) => p.name.toLowerCase().includes(query.toLowerCase()));
  const setQty = (id, qty) => setCart((c) => ({ ...c, [id]: Math.max(0, qty) }));
  const cartItems = Object.entries(cart).filter(([, q]) => q > 0);
  const cartTotal = cartItems.reduce((s, [id, q]) => { const p = products.find((x) => x.id === id); return s + (p ? p.price * q : 0); }, 0);
  const checkout = async () => {
    if (cartItems.length === 0) return notify("Your cart is empty");
    const items = cartItems.map(([id, q]) => { const p = products.find((x) => x.id === id); return { productId: id, qty: q, price: p.price }; });
    await placeOrder({ customerName: user.name, phone, items });
    setCart({});
    notify("Order placed! The store will confirm it shortly.");
  };
  return (
    <div className="shopgrid" style={{ display: "grid", gridTemplateColumns: "1fr 300px", gap: 18, alignItems: "start" }}>
      <div>
        <div style={{ position: "relative", marginBottom: 14 }}>
          <div style={{ position: "absolute", left: 12, top: 12, color: T.paperDim }}><Icon name="search" size={15} /></div>
          <Input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search products…" style={{ paddingLeft: 34 }} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px,1fr))", gap: 14 }}>
          {visible.map((p) => {
            const stock = stockFor(p.id); const out = stock <= 0;
            return (
              <Card key={p.id} style={{ padding: 16 }}>
                <div style={{ fontSize: 10, color: T.paperDim, textTransform: "uppercase", letterSpacing: 0.4 }}>{p.category}</div>
                <div style={{ fontFamily: DISPLAY, fontSize: 16, marginTop: 4 }}>{p.name}</div>
                <div style={{ fontFamily: MONO, color: T.goldLight, fontSize: 15, marginTop: 8 }}>{fmt(p.price)}</div>
                <div style={{ marginTop: 4 }}><Pill tone={out ? "warn" : "ok"}>{out ? "Out of stock" : `${stock} in stock`}</Pill></div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12 }}>
                  <Input type="number" min={0} max={stock} disabled={out} value={cart[p.id] || ""} onChange={(e) => setQty(p.id, Math.min(stock, Number(e.target.value)))} placeholder="0" style={{ width: 64 }} />
                  <Button variant="ghost" disabled={out} onClick={() => setQty(p.id, Math.min(stock, (cart[p.id] || 0) + 1))} style={{ padding: "8px 10px" }}><Icon name="plus" size={13} /></Button>
                </div>
              </Card>
            );
          })}
        </div>
      </div>
      <Card style={{ padding: 16, position: "sticky", top: 8 }}>
        <SectionTitle icon="cart" title={`Cart (${cartItems.length})`} />
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12 }}>
          {cartItems.length === 0 && <div style={{ fontSize: 12, color: T.paperDim }}>Add items from the shop to order.</div>}
          {cartItems.map(([id, q]) => {
            const p = products.find((x) => x.id === id);
            return (
              <div key={id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5 }}>
                <span>{q} × {p.name}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontFamily: MONO }}>{fmt(q * p.price)}</span>
                  <span style={{ cursor: "pointer", color: T.paperDim }} onClick={() => setQty(id, 0)}><Icon name="trash" size={13} /></span>
                </div>
              </div>
            );
          })}
          {cartItems.length > 0 && (
            <div style={{ borderTop: `1px solid ${T.line}`, marginTop: 6, paddingTop: 10, display: "flex", justifyContent: "space-between", fontWeight: 700 }}>
              <span>Total</span><span style={{ fontFamily: MONO, color: T.goldLight }}>{fmt(cartTotal)}</span>
            </div>
          )}
        </div>
        <div style={{ marginTop: 14 }}><Field label="Delivery / contact phone"><Input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="07xx xxx xxx" /></Field></div>
        <Button onClick={checkout} style={{ width: "100%", justifyContent: "center", marginTop: 12 }}><Icon name="cart" size={14} /> Place order</Button>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  CUSTOMER — My Orders                                                  */
/* ---------------------------------------------------------------------- */
function CustomerOrders({ orders, products, user }) {
  const mine = orders.filter((o) => o.customerName === user.name);
  return (
    <Card style={{ padding: 18 }}>
      <SectionTitle icon="clipboard" title="My orders" />
      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 12 }}>
        {mine.length === 0 && <div style={{ color: T.paperDim, fontSize: 13 }}>You haven't placed any orders yet.</div>}
        {mine.map((o) => (
          <div key={o.id} style={{ border: `1px solid ${T.line}`, borderRadius: 8, padding: 14, background: T.bg }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={{ fontWeight: 700 }}>{o.createdAt}</span>
              <Pill tone={o.status === "fulfilled" ? "ok" : o.status === "cancelled" ? "warn" : "idle"}>{o.status}</Pill>
            </div>
            <div style={{ marginTop: 8 }}>
              {o.items.map((it, i) => {
                const p = products.find((x) => x.id === it.productId);
                return <div key={i} style={{ fontSize: 12.5, fontFamily: MONO, color: T.paperDim }}>{it.qty} × {p?.name || "Unknown"} — {fmt(it.qty * it.price)}</div>;
              })}
            </div>
            {o.invoiceNo && <div style={{ fontSize: 12, color: T.goldLight, marginTop: 6 }}>Invoice: {o.invoiceNo}</div>}
          </div>
        ))}
      </div>
    </Card>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
